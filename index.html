<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182c47"><meta name="robots" content="noindex,nofollow"><title>東京｜旅記</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main>
<header><div><p class="eyebrow">JAPAN / 2027</p><h1>東京旅記</h1><p>01.10 — 01.16</p></div><div class="header-actions"><button id="identity-button" aria-label="切換編輯者">選擇姓名</button><button id="add" class="primary">＋ 新增</button></div></header>

<section id="flights" class="flight-overview" aria-label="航班"></section>
<div class="toolbar"><nav aria-label="旅行分頁"><button data-view="list" aria-selected="true">想去清單</button><button data-view="plan" aria-selected="false">每日行程</button><button data-view="stay" aria-selected="false">住宿候選</button><button data-view="todo" aria-selected="false">待辦事項</button></nav><span id="status" role="status" aria-live="polite">連線中…</span></div>
<section id="content" aria-label="旅行內容"><p class="empty">正在讀取大家的清單…</p></section>

</main>
<dialog id="editor"><form id="form"><div class="modal-head"><h2 id="form-title">新增想去的地方</h2><button type="button" id="close" aria-label="關閉">✕</button></div><label>名稱<input name="title" required maxlength="160" placeholder="想去的店或景點"></label><div class="form-grid"><label>分類<select name="category"><option>餐廳</option><option>景點</option><option>住宿</option><option value="待辦">待辦事項</option><option>航班</option></select></label><label id="kind-field">類型<select name="kind"><option value="">餐廳</option><option value="酒吧">酒吧</option></select></label></div><label id="meal-field">用餐時段<select name="meal"><option value="">未定</option><option>早餐</option><option>午餐</option><option>晚餐</option><option value="其他時段">點心／宵夜</option></select></label><label>地圖或住宿連結<input name="link" type="url" maxlength="2000" placeholder="https://…"></label><div class="form-grid"><label>安排日期<select name="day"><option value="">先放清單</option><option value="2027-01-10">1/10（日）</option><option value="2027-01-11">1/11（一）</option><option value="2027-01-12">1/12（二）</option><option value="2027-01-13">1/13（三）</option><option value="2027-01-14">1/14（四）</option><option value="2027-01-15">1/15（五）</option><option value="2027-01-16">1/16（六）</option></select></label><label>時間（可留空）<input name="at_time" type="time"></label></div><label>備註<textarea name="note" rows="3" maxlength="2000" placeholder="想吃什麼、注意事項…"></textarea></label><p id="form-error" role="alert"></p><div class="modal-actions"><button type="button" id="remove" class="danger" hidden>刪除</button><button type="submit" id="save" class="primary">儲存</button></div></form></dialog>
<dialog id="identity-dialog"><div class="modal-head"><h2>你是哪位？</h2></div><div class="identity-options"><button data-person="Sam">Sam</button><button data-person="家賢">家賢</button><button data-person="沛霖">沛霖</button><button data-person="子穎">子穎</button></div></dialog>
</body></html>
