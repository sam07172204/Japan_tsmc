<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182c47"><meta name="robots" content="noindex,nofollow"><title>東京旅行｜四人共編</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main>
<header><div><p class="eyebrow">JAPAN / 2027</p><h1>東京，一起規劃。</h1><p>1/10 — 1/16 <span class="divider">/</span> 4 人旅行</p></div><button id="add" class="primary">＋ 新增想去的地方</button></header>
<div class="notice">先把想去的放進來，不一定全部要去。</div>
<div class="toolbar"><nav aria-label="旅行分頁"><button data-view="list" aria-selected="true">想去清單</button><button data-view="plan" aria-selected="false">每日行程</button><button data-view="stay" aria-selected="false">住宿候選</button></nav><span id="status" role="status" aria-live="polite">連線中…</span></div>
<section id="content" aria-label="旅行內容"><p class="empty">正在讀取大家的清單…</p></section>
<footer>免登入共同編輯 · 每 10 秒同步 <span>有連結的人都能查看及修改，請只分享給同行朋友。</span></footer>
</main>
<dialog id="editor"><form id="form"><div class="modal-head"><h2 id="form-title">新增想去的地方</h2><button type="button" id="close" aria-label="關閉">✕</button></div><label>名稱<input name="title" required maxlength="160" placeholder="想去的店或景點"></label><div class="form-grid"><label>分類<select name="category"><option>餐廳</option><option>酒吧</option><option>景點</option><option>購物</option><option>住宿</option><option>其他</option></select></label><label>區域 / 住宿日期<input name="area" maxlength="160" placeholder="例如：新宿"></label></div><label>地圖或住宿連結<input name="link" type="url" maxlength="2000" placeholder="https://…"></label><label>備註<textarea name="note" rows="3" maxlength="2000" placeholder="想吃什麼、注意事項…"></textarea></label><div class="form-grid"><label>安排日期<select name="day"><option value="">先放清單</option><option value="2027-01-10">1/10（日）</option><option value="2027-01-11">1/11（一）</option><option value="2027-01-12">1/12（二）</option><option value="2027-01-13">1/13（三）</option><option value="2027-01-14">1/14（四）</option><option value="2027-01-15">1/15（五）</option><option value="2027-01-16">1/16（六）</option></select></label><label>時間（可留空）<input name="at_time" type="time"></label></div><p id="form-error" role="alert"></p><div class="modal-actions"><button type="button" id="remove" class="danger" hidden>刪除</button><button type="submit" id="save" class="primary">儲存</button></div></form></dialog>
</body></html>
